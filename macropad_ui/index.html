<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacroPad UI</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#1c2230; --muted:#6b7385; --line:#dde1e9;
  --accent:#3b6cf6; --accent-ink:#fff; --key:#fff; --key-sel:#e7eeff; --ok:#1a9d55; --bad:#d23b3b; --warn:#c98a00;
  --mouse:#8a4fd6; --media:#d6694f; --kbd:#3b6cf6;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14171e; --panel:#1d222c; --ink:#e7eaf1; --muted:#8c94a8; --line:#2d3442;
  --accent:#6f95ff; --accent-ink:#0d1220; --key:#252b38; --key-sel:#2c3b66; --ok:#46c27d; --bad:#ff6b6b; --warn:#e6b422;
  --mouse:#b78af0; --media:#f08e6f; --kbd:#6f95ff;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:16px;margin:0 8px 0 0}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.bad{color:var(--bad);border-color:var(--bad)} .pill.warn{color:var(--warn);border-color:var(--warn)}
.sp{flex:1}
main{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr);gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{border-radius:8px 8px 0 0}
.tab.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.led{width:8px;height:8px;border-radius:50%;background:#2c3a30;box-shadow:inset 0 1px 1px #0008}
.led.on{background:#3dff8a;box-shadow:0 0 8px 2px #3dff8a99}
.key{position:relative;min-width:78px;height:76px;border-radius:12px;cursor:pointer;user-select:none;
  background:linear-gradient(180deg,#3a3e48,#272a32);border:1px solid #0e1014;
  box-shadow:0 5px 0 #0c0d10,0 8px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;padding:6px 6px 8px;text-align:center;color:#eef1f8;transition:transform .06s,box-shadow .06s}
.key:hover{filter:brightness(1.15)}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 #0c0d10,0 3px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22)}
.key .pos{position:absolute;left:7px;top:4px;font-size:9px;color:#7b8396}
.key .bar{position:absolute;left:14px;right:14px;top:3px;height:3px;border-radius:3px;background:transparent}
.key.t-kbd .bar{background:var(--kbd)} .key.t-mouse .bar{background:var(--mouse)} .key.t-media .bar{background:var(--media)}
.key .v{font-size:19px;font-weight:600;line-height:1.15;word-break:normal;overflow-wrap:anywhere;letter-spacing:.01em}
.key .v.sm{font-size:14px}.key .v.xs{font-size:11px}
.key .v small{display:block;font-size:10px;font-weight:400;color:#9aa3b8}
.key .seq{display:block;font-size:12px;color:#c3cadb;margin-top:2px}
.key.empty .v{color:#576074;font-weight:400}
.key.sel{outline:3px solid var(--accent);outline-offset:3px}
.dial{position:relative;width:84px;height:84px;border-radius:50%;
  background:conic-gradient(from 20deg,#555b68,#2a2d35,#6a7080,#2a2d35,#555b68,#2a2d35,#6a7080,#2a2d35,#555b68);
  box-shadow:0 7px 12px rgba(0,0,0,.6),inset 0 0 0 3px #0e1014,inset 0 0 0 5px #4a4f5b;display:flex;align-items:center;justify-content:center}
.dial .cap .v{font-size:13px}.dial .cap{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4f5b,#1d2027);
  border:1px solid #0e1014;box-shadow:inset 0 1px 0 rgba(255,255,255,.2);cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:#eef1f8;font-size:14px;font-weight:600;text-align:center;position:relative;line-height:1.1;padding:3px}
.dial .cap::before{content:"";position:absolute;top:3px;width:3px;height:9px;border-radius:2px;background:#9aa3b8}
.dial .cap.sel{outline:3px solid var(--accent);outline-offset:2px}
.dial .cap .nm{position:absolute;bottom:-17px;font-size:9px;color:#8b93a6;font-weight:400}
.rot{width:54px;height:36px;border-radius:10px;cursor:pointer;background:linear-gradient(180deg,#31353f,#20232a);border:1px solid #0e1014;
  box-shadow:0 3px 0 #0c0d10,inset 0 1px 0 rgba(255,255,255,.15);color:#eef1f8;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;text-align:center;line-height:1.1;position:relative;padding:2px}
.rot .arr{position:absolute;top:2px;font-size:10px;color:#8b93a6}
.rot .tx{margin-top:6px}.rot .arr{left:4px;top:1px}
.rot.empty{color:#576074;font-weight:400}
.rot.sel{outline:3px solid var(--accent);outline-offset:2px}
.rot.t-kbd{border-bottom:2px solid var(--kbd)}.rot.t-mouse{border-bottom:2px solid var(--mouse)}.rot.t-media{border-bottom:2px solid var(--media)}
.stage{position:relative;transform-origin:0 0}
.stage svg{position:absolute;left:0;top:0;overflow:visible}
.stage .key,.stage .rot,.stage .dial,.stage .led{position:absolute}
.stage .key{min-width:0}
.stage .led{width:9px;height:9px;margin:-4.5px 0 0 -4.5px}
.opick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.opick button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;font-size:11px;max-width:112px;text-align:center;line-height:1.2}
.opick button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);background:var(--key-sel)}
.opick svg{width:78px;height:62px}
.toast{position:fixed;top:64px;right:16px;max-width:540px;z-index:20;padding:12px 34px 12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);box-shadow:0 8px 24px rgba(0,0,0,.35);white-space:pre-line}
.toast.ok{border-color:var(--ok)} .toast.bad{border-color:var(--bad)}
.toast code{display:block;margin:8px 0;padding:6px 8px;background:var(--key);border-radius:6px;font:12px ui-monospace,Menlo,monospace;word-break:break-all;user-select:all;white-space:normal}
.toast .x{position:absolute;top:2px;right:4px;border:none;background:none;font-size:18px;padding:2px 8px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:3px;vertical-align:middle;margin-right:5px}
.pv{font-size:15px;font-weight:600;margin:6px 0 0;min-height:22px}
.ed-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chk{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;user-select:none}
.chk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:ui-monospace,Menlo,monospace;background:var(--key-sel);border-radius:6px;padding:3px 4px 3px 8px;font-size:12px}
.chip button{border:none;background:none;padding:0 4px;color:var(--muted)}
.muted{color:var(--muted);font-size:12px}
.full{grid-column:1/-1}
pre{margin:0;max-height:260px;overflow:auto;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap}
#log{max-height:140px}
.cap{background:var(--warn);color:#000;border-color:var(--warn)}
.opts button{font-size:12px;padding:4px 8px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:8px}
</style>
</head>
<body>
<div id="toast" class="toast" hidden></div>
<header>
  <h1>⌨️ MacroPad UI</h1>
  <select id="cfgSel" data-i-title="cfgTitle"></select>
  <button id="btnNew" data-i="new">New</button>
  <button id="btnSave" data-i="save">Save</button>
  <button id="btnSaveAs" data-i="saveAs">Save as…</button>
  <span id="dirty" class="muted"></span>
  <span class="sp"></span>
  <span id="devPill" class="pill">…</span>
  <span id="valPill" class="pill">—</span>
  <select id="ledSel" data-i-title="ledTitle"><option value="" data-i="led">LED…</option><option>0</option><option>1</option><option>2</option><option>3</option></select>
  <select id="langSel" data-i-title="language"><option value="en">English</option><option value="pt">Português</option></select>
  <button id="btnQuit" data-i-title="quitTitle">⏻</button>
  <button id="btnUpload" class="primary" data-i="upload">⬆ Upload to keyboard</button>
</header>

<main>
  <section class="card">
    <h2 data-i="secKeyboard">Keyboard</h2>
    <div class="row" style="margin-bottom:10px">
      <label data-i-title="rowsTitle"><span data-i="rows">Rows</span> <input id="rows" type="number" min="1" max="6" style="width:60px"></label>
      <label><span data-i="cols">Columns</span> <input id="cols" type="number" min="1" max="6" style="width:60px"></label>
      <label><span data-i="knobs">Knobs</span> <input id="knobsN" type="number" min="0" max="4" style="width:60px"></label>
    </div>
    <div class="muted" style="margin:2px 0 6px" data-i="posHelp"></div>
    <div class="opick" id="opick"></div>
    <div class="tabs" id="tabs"></div>
    <input type="file" id="impFile" accept=".yaml,.yml,text/yaml,text/plain" hidden>
    <div id="board"></div>
    <div class="legend"><span><i style="background:var(--kbd)"></i><span data-i="lgKbd">keyboard</span></span><span><i style="background:var(--mouse)"></i><span data-i="lgMouse">mouse</span></span><span><i style="background:var(--media)"></i><span data-i="lgMedia">media</span></span><span>⌃ ctrl · ⌥ opt/alt · ⇧ shift · ⌘ cmd/win</span></div>
    <p class="muted" style="margin-bottom:0" data-i="boardHelp"></p>
  </section>

  <section class="card">
    <h2 id="edTitle">Editor</h2>
    <div id="editor"></div>
  </section>

  <section class="card full">
    <details>
      <summary data-i="yamlGen">Generated YAML</summary>
      <pre id="yamlOut"></pre>
    </details>
    <h2 data-i="logTitle">Log</h2>
    <pre id="log"></pre>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);

// ---------- i18n (English / Português)
const I18N = {

  termHint:"Alternativa: rode isto no Terminal (a senha é pedida lá):",
  exportLayer:"Exportar esta camada para um arquivo", importLayer:"Importar uma camada de um arquivo", exported:"Exportado: {f}",

let LANG = (() => { const q = new URLSearchParams(location.search).get("lang"); if (q === "en" || q === "pt") return q;
  try { const s = localStorage.getItem("lang"); if (s === "en" || s === "pt") return s; } catch (e) {}
  return (navigator.language || "en").toLowerCase().startsWith("pt") ? "pt" : "en"; })();
const t = (k, v = {}) => String((I18N[LANG] && I18N[LANG][k]) ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
function applyStatic(){
  document.documentElement.lang = LANG; document.title = t("app");

function chordPretty(c){

const P=88, ORIENTS=["normal","clockwise","counterclockwise","upsidedown"];
function layout(o,rows,cols,n){

  }
  const W=Bw+104+(n>=3?KB:kr)+22;
  const bodyBottom=Math.max(Bh, n?kn[n-1].y+kn[n-1].r+22:Bh);
  const pL=24,pT=36,pR=24,pB=30, FW0=W+pL+pR, FH0=bodyBottom+pT+pB;
  const horiz=o==="normal"||o==="upsidedown";

    <rect x="${Bw+60}" y="-12" width="44" height="14" rx="3" fill="#aeb5b2" stroke="#3a3f3d"/><rect x="${Bw+68}" y="-34" width="28" height="26" rx="5" fill="#1a1c20"/>

function convertCfgObj(c,nO){

  MODS.forEach(([k,lab])=>{const s=document.createElement("span");s.className="chk"+(draft.mods.has(k)?" on":"");s.textContent=lab;
    s.onclick=()=>{draft.mods.has(k)?draft.mods.delete(k):draft.mods.add(k);renderDraft(mr)};mr.appendChild(s);});
  const ks=$("#keySel");
  allKeyNames().forEach(([g,list])=>{const og=document.createElement("optgroup");og.label=g;list.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k;og.appendChild(o)});ks.appendChild(og)});
  ks.value=draft.key; ks.onchange=()=>{draft.key=ks.value;$("#custom").value="";updateDraftTxt()};
  $("#custom").oninput=e=>{if(e.target.value!==""){draft.key=`<${e.target.value}>`;ks.value="";}else draft.key="";updateDraftTxt()};
  $("#addChord").onclick=()=>applyChord(true);
  $("#setChord").onclick=()=>applyChord(false);
  $("#capBtn").onclick=toggleCapture;
  const mo=$("#mouseRow"); MOUSE.forEach(m=>{const b=document.createElement("button");b.textContent=m;b.onclick=()=>{setVal(sel,m);renderAll()};mo.appendChild(b)});
  document.querySelectorAll("[data-mm]").forEach(el=>el.onclick=()=>{setVal(sel,el.dataset.mm+"-wheelup");renderAll()});
  const md=$("#mediaRow"); MEDIA.forEach(m=>{const b=document.createElement("button");b.textContent=m;b.onclick=()=>{setVal(sel,m);renderAll()};md.appendChild(b)});
  updateDraftTxt();
}
function renderDraft(mr){ mr.querySelectorAll(".chk").forEach((el,i)=>el.classList.toggle("on",draft.mods.has(MODS[i][0]))); updateDraftTxt(); }
function draftChord(){
  const parts=MODS.map(m=>m[0]).filter(k=>draft.mods.has(k)); if(draft.key) parts.push(draft.key);
  return parts.join("-");
}
function updateDraftTxt(){ const c=draftChord(); const el=$("#draftTxt"); if(el) el.textContent=c?t("chordIs",{c}):t("chordHelp"); }
function applyChord(append){
  const c=draftChord(); if(!c) return;
  const cur=getVal(sel);
  setVal(sel, append && cur && typeOf(cur)==="kbd" ? cur+","+c : c);
  draft={mods:new Set(),key:""}; renderAll();
}
function renderSeq(chords){
  const el=$("#seq"); el.innerHTML="";
  chords.forEach((c,i)=>{const s=document.createElement("span");s.className="chip";s.textContent=c;
    const x=document.createElement("button");x.textContent="×";x.onclick=()=>{const a=getVal(sel).split(",");a.splice(i,1);setVal(sel,a.join(","));renderAll()};
    s.appendChild(x);el.appendChild(s)});
  $("#seqWarn").textContent = chords.length>SEQ_MAX ? t("seqWarn",{n:SEQ_MAX}) : "";
}
function renderSeqOnly(){ const pv=$('#pv'); if(pv) pv.textContent=pretty(getVal(sel)).txt; const v=getVal(sel); renderSeq(typeOf(v)==="kbd"?v.split(","):[]); }

// ---------- text <-> key sequence (US-QWERTY key positions; also correct for the macOS "Brazilian - Pro" layout, ASCII only)
const SYM_U={"-":"minus","=":"equal","[":"leftbracket","]":"rightbracket","\\":"backslash",";":"semicolon","'":"quote","`":"grave",",":"comma",".":"dot","/":"slash"};
const SYM_S={"!":"1","@":"2","#":"3","$":"4","%":"5","^":"6","&":"7","*":"8","(":"9",")":"0","_":"minus","+":"equal","{":"leftbracket","}":"rightbracket","|":"backslash",":":"semicolon",'"':"quote","~":"grave","<":"comma",">":"dot","?":"slash"};
const CH2CHORD={" ":"space","\t":"tab","\n":"enter"};
for(const c of "abcdefghijklmnopqrstuvwxyz0123456789") CH2CHORD[c]=c;
for(const c of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") CH2CHORD[c]="shift-"+c.toLowerCase();
for(const [c,k] of Object.entries(SYM_U)) CH2CHORD[c]=k;
for(const [c,k] of Object.entries(SYM_S)) CH2CHORD[c]="shift-"+k;
const CHORD2CH=Object.fromEntries(Object.entries(CH2CHORD).map(([c,k])=>[k,c]));
function textToChords(s,enter){
  const out=[],bad=new Set();
  for(const ch of s){ if(CH2CHORD[ch]) out.push(CH2CHORD[ch]); else bad.add(ch); }
  if(enter) out.push("enter");
  return {chords:out,bad:[...bad]};
}
function chordsToText(v){
  if(!v||typeOf(v)!=="kbd") return null;
  let a=v.split(","), enter=false;
  if(a.length>1&&a[a.length-1]==="enter"){enter=true;a=a.slice(0,-1);}
  let s=""; for(const c of a){ if(!CHORD2CH[c]||c==="enter") return null; s+=CHORD2CH[c]; }
  return {text:s,enter};
}
function updateTxtInfo(){
  const s=$("#txt").value, r=textToChords(s,txtEnter), n=r.chords.length;
  let msg=t("txtCount",{n,max:SEQ_MAX}); const ok=n>0&&n<=SEQ_MAX&&!r.bad.length;
  if(r.bad.length) msg+=t("txtBad",{c:r.bad.map(c=>JSON.stringify(c)).join(" ")});
  else if(n>SEQ_MAX) msg+=t("txtLong");
  $("#txtInfo").textContent=msg; $("#txtInfo").style.color=ok||!s?"":"var(--warn)";
  $("#txtSet").disabled=!ok; $("#txtAdd").disabled=!ok||typeOf(getVal(sel))!=="kbd";
  return r;
}

// ---------- capture keyboard
const CODE_MAP={Enter:"enter",Escape:"escape",Backspace:"backspace",Tab:"tab",Space:"space",Minus:"minus",Equal:"equal",
 BracketLeft:"leftbracket",BracketRight:"rightbracket",Backslash:"backslash",Semicolon:"semicolon",Quote:"quote",Backquote:"grave",
 Comma:"comma",Period:"dot",Slash:"slash",CapsLock:"capslock",PrintScreen:"printscreen",ScrollLock:"scrolllock",Pause:"pause",
 Insert:"insert",Home:"home",PageUp:"pageup",Delete:"delete",End:"end",PageDown:"pagedown",ArrowRight:"right",ArrowLeft:"left",
 ArrowDown:"down",ArrowUp:"up",NumLock:"numlock",NumpadDivide:"numpadslash",NumpadMultiply:"numpadasterisk",NumpadSubtract:"numpadminus",
 NumpadAdd:"numpadplus",NumpadEnter:"numpadenter",NumpadDecimal:"numpaddot",NumpadEqual:"numpadequal",ContextMenu:"application",IntlBackslash:"nonusbackslash"};
const MOD_MAP={ControlLeft:"ctrl",ControlRight:"rctrl",ShiftLeft:"shift",ShiftRight:"rshift",AltLeft:"opt",AltRight:"ropt",MetaLeft:"cmd",MetaRight:"rcmd"};
function codeToKey(c){
  if(MOD_MAP[c]) return null;
  if(/^Key[A-Z]$/.test(c)) return c[3].toLowerCase();
  if(/^Digit\d$/.test(c)) return c[5];
  if(/^F\d+$/.test(c)) return c.toLowerCase();
  if(/^Numpad\d$/.test(c)) return "numpad"+c[6];
  return CODE_MAP[c]||null;
}
function toggleCapture(){
  capturing=!capturing; capMods=new Set(); capKey=null;
  const b=$("#capBtn"); b.classList.toggle("cap",capturing); b.textContent=capturing?t("capturing"):t("capture");
}
const held=new Set();
window.addEventListener("keydown",e=>{
  if(!capturing) return; e.preventDefault(); e.stopPropagation();
  held.add(e.code);
  if(MOD_MAP[e.code]) capMods.add(MOD_MAP[e.code]); else { const k=codeToKey(e.code); if(k) capKey=k; else log(t("noEquiv",{c:e.code})); }
  draft.mods=new Set(capMods); draft.key=capKey||""; const mr=$("#modRow"); if(mr) renderDraft(mr); const ks=$("#keySel"); if(ks) ks.value=draft.key;
},true);
window.addEventListener("keyup",e=>{
  if(!capturing) return; e.preventDefault(); held.delete(e.code);
  if(held.size===0 && (capMods.size||capKey)){ capturing=false; const b=$("#capBtn"); if(b){b.classList.remove("cap");b.textContent=t("capture");} }
},true);

// ---------- remember where you left off (last config / working copy), stored by the local server
let persistTimer=null;
function persist(){
  clearTimeout(persistTimer);
  persistTimer=setTimeout(()=>{ if(cfg) api("/api/draft",{name:cfgName,config:cfg,layer}).catch(()=>{}); },600);
}
function rememberLast(name){ if(name) api("/api/last",{name}).catch(()=>{}); }

// ---------- state / dirty / yaml / validate
function snapshot(){ return JSON.stringify(cfg); }
function updateDirty(){ $("#dirty").textContent = cfg && snapshot()!==saved ? t("unsaved") : ""; }
function changed(){
  updateDirty(); persist();
  clearTimeout(validateTimer); validateTimer=setTimeout(()=>{updateYaml();validate()},400);
}
async function updateYaml(){ const r=await api("/api/yaml",{config:cfg}); $("#yamlOut").textContent=r.yaml||""; }
async function validate(){
  const r=await api("/api/validate",{config:cfg}); const p=$("#valPill");
  p.textContent=r.ok?t("valid"):t("invalid"); p.className="pill "+(r.ok?"ok":"bad"); p.title=r.message||"";
  if(!r.ok) log(t("valLog",{m:r.message}));
  return r.ok;
}
async function refreshDevice(){
  const r=await api("/api/device"); const p=$("#devPill"); if(r.device) SEQ_MAX=r.device.endsWith("8890")?5:18;
  p.textContent=r.device?t("devFound",{id:r.device}):t("devNone"); p.className="pill "+(r.device?"ok":"bad");
}
async function loadConfig(name){
  const r=await api("/api/config?name="+encodeURIComponent(name));
  if(r.error){log(apiMsg(r));return;}
  cfg=r; cfgName=name; layer=0; sel=null; normalize(); saved=snapshot(); $("#cfgSel").value=name;
  renderAll(); updateDirty(); validate(); rememberLast(name); persist();
  if(cfg.orientation!=="normal") log(t("loadWarn",{o:cfg.orientation}));
}
async function refreshList(select){
  const s=await api("/api/state"); const el=$("#cfgSel"); el.innerHTML="";
  s.configs.forEach(n=>{const o=document.createElement("option");o.textContent=n;el.appendChild(o)});
  if(select) el.value=select; return s;
}
async function save(name){
  const r=await api("/api/save",{name,config:cfg});
  if(r.error){alert(apiMsg(r));return;}
  cfgName=name; saved=snapshot(); updateDirty(); await refreshList(name); log(t("saved",{n:name})); rememberLast(name); persist();
}

// ---------- visible feedback (upload result etc.)
function toast(kind, msg, cmd){
  const el=$("#toast"); el.className="toast "+kind; el.hidden=false; el.innerHTML="";
  const m=document.createElement("div"); m.textContent=msg; el.appendChild(m);
  if(cmd){ const c=document.createElement("code"); c.textContent=cmd; el.appendChild(c);
    const b=document.createElement("button"); b.textContent=t("toastCopy");
    b.onclick=async()=>{ try{ await navigator.clipboard.writeText(cmd); b.textContent=t("toastCopied"); }catch(e){ const r=document.createRange(); r.selectNodeContents(c); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } };
    el.appendChild(b); }
  const x=document.createElement("button"); x.className="x"; x.textContent="×"; x.onclick=()=>{el.hidden=true}; el.appendChild(x);
  clearTimeout(toast.t); if(kind==="ok") toast.t=setTimeout(()=>{el.hidden=true},6000);
}

// ---------- wiring
function bindTop(){
  const upd=()=>{cfg.rows=+$("#rows").value||1;cfg.columns=+$("#cols").value||1;cfg.knobs=+$("#knobsN").value||0;sel=null;normalize();changed();renderAll()};
  ["#rows","#cols","#knobsN"].forEach(s=>$(s).onchange=upd);
  $("#langSel").onchange=e=>setLang(e.target.value);
  $("#impFile").onchange=e=>{ const f=e.target.files[0]; e.target.value=""; if(f) importLayerFile(f); };
  $("#cfgSel").onchange=async e=>{ if(snapshot()!==saved && !confirm(t("discard"))){e.target.value=cfgName;return;} loadConfig(e.target.value); };
  $("#btnSave").onclick=()=>{ const n=cfgName||prompt(t("namePrompt")); if(n) save(n.trim()); };
  $("#btnSaveAs").onclick=()=>{const n=prompt(t("saveAsPrompt"),(cfgName||t("newName"))+t("copySuffix")); if(n) save(n.trim());};
  $("#btnNew").onclick=()=>{
    if(snapshot()!==saved && !confirm(t("discard"))) return;
    cfg={orientation:"normal",rows:3,columns:4,knobs:3,layers:[{buttons:[],knobs:[]},{buttons:[],knobs:[]},{buttons:[],knobs:[]}]};
    cfgName=null; layer=0; sel=null; normalize(); saved=""; renderAll(); changed(); $("#cfgSel").selectedIndex=-1;
  };
  $("#btnUpload").onclick=async()=>{
    const ok=await validate(); if(!ok){ alert(t("invalidAlert")); return; }
    const oWarn=cfg.orientation!=="normal"?t("orientWarn",{o:cfg.orientation}):"";
    if(!confirm(t("uploadConfirm")+oWarn)) return;
    const b=$("#btnUpload"); b.disabled=true; b.textContent=t("uploading"); log(t("uploadingLog"));
    const r=await api("/api/upload",{config:cfg}); b.disabled=false; b.textContent=t("upload");
    if(r.ok){ rememberLast(cfgName); persist(); toast("ok", t("toastOk",{time:new Date().toLocaleTimeString()})); }
    else { const first=(apiMsg(r)||"").split("\n").filter(Boolean).slice(0,3).join(" · ");
           toast("bad", `${t("toastFail")}\n${first}`+(r.gui===false?`\n\n${t("toastNoGui")}`:(r.terminal_cmd?`\n\n${t("toastCmd")}`:"")), r.terminal_cmd); }
    log((r.ok?"✓ ":"✗ ")+apiMsg(r)+(r.terminal_cmd?`\n${t("termHint")}\n${r.terminal_cmd}`:"")); refreshDevice();
  };
  $("#btnQuit").onclick=async()=>{ if(!confirm(t("quitConfirm"))) return; try{await api("/api/quit",{});}catch(e){} document.body.innerHTML=`<p style="padding:30px;font-size:16px">${t("quitDone")}</p>`; };
  $("#ledSel").onchange=async e=>{ if(e.target.value==="")return; const r=await api("/api/led",{index:+e.target.value}); log((r.ok?"✓ ":"✗ ")+apiMsg(r)); if(!r.ok) toast("bad", `${t("toastFail")}\n${(apiMsg(r)||"").split("\n")[0]}`); e.target.value=""; };
}

(async function init(){
  applyStatic();
  const s=await refreshList();
  KEYS=s.keys; MEDIA=(KEYS["Media keys"]||[]).map(x=>x[0]);
  if(!s.tool) log(t("toolMissing"));
  bindTop(); refreshDevice(); setInterval(refreshDevice,5000);
  const d=s.draft, okDraft=d&&d.config&&Array.isArray(d.config.layers)&&d.config.layers.length&&(d.name==null||s.configs.includes(d.name));
  if(okDraft){                                   // reopen exactly where you left off (even unsaved edits)
    cfg=d.config; cfgName=d.name||null; layer=Math.min(d.layer||0,cfg.layers.length-1); sel=null; normalize();
    saved="";
    if(cfgName){ const r=await api("/api/config?name="+encodeURIComponent(cfgName)); if(!r.error){ const keep=cfg; cfg=r; normalize(); saved=snapshot(); cfg=keep; } $("#cfgSel").value=cfgName; }
    else $("#cfgSel").selectedIndex=-1;
    renderAll(); updateDirty(); validate(); log(t("restored",{n:cfgName||t("newName")}));
  } else {
    const first = (s.last&&s.configs.includes(s.last)&&s.last) || s.configs.find(n=>n.startsWith("starter")) || s.configs[0];
    if(first) await loadConfig(first); else $("#editor").innerHTML=`<p class="muted">${t("pickKey")}</p>`;
  }
  $("#edTitle").textContent=t("editor");
})();
</script>
